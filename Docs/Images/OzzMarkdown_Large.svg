<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="diag45" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A0CA3"/>
      <stop offset="100%" stop-color="#7209B7"/>
    </linearGradient>

    <!-- Parantezler için Hibrit Geçiş: Üstü yumuşak lila-beyaz, altı netlik için neon yeşil -->
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DDE1F8"/>
      <stop offset="100%" stop-color="#39FF14"/>
    </linearGradient>

    <style>
      .arrow-stroke { stroke: url(#bracketGrad);}
      .line-stroke { stroke: #DDE1F8; }
      .chev-stroke { stroke: #F72585; }
    </style>
  </defs>
  <!-- Background -->
  <rect x="0" y="0" width="1024" height="1024" rx="120" fill="url(#diag45)"/>
  
  <!-- Downward arrow (scaled + centered) -->
  <g id="ozzmd-arrow" class="line-stroke" stroke-width="128" fill="none"
   stroke-linecap="butt" stroke-linejoin="miter">

    <!-- Vertical line -->
    <line x1="512" y1="96" x2="512" y2="656" />

    <!-- Arrow head -->
    <polygon points="448,720 576,720 512,816" />
  </g>

  <!-- Left Bracket
  <path d="M 128 928 L 128 96" class="line-stroke" stroke-width="96"/>
  <path d="M 176 880 L 320 880" class="line-stroke" stroke-width="96"/>
  <path d="M 176 144 L 320 144" class="line-stroke" stroke-width="96"/>
   -->
  <!-- Right Bracket
  <path d="M 896 928 L 896 96" class="line-stroke" stroke-width="96"/>
  <path d="M 848 880 L 704 880" class="line-stroke" stroke-width="96"/>
  <path d="M 848 144 L 704 144" class="line-stroke" stroke-width="96"/>
   -->
  <!-- Chevron M -->
  <path d="M 256 724 L 400 300" class="chev-stroke" stroke-width="96" stroke-linecap="round"/>
  <path d="M 512 724 L 400 300" class="chev-stroke" stroke-width="96" stroke-linecap="round"/>
  <path d="M 512 724 L 656 300" class="chev-stroke" stroke-width="96" stroke-linecap="round"/>
  <path d="M 768 724 L 656 300" class="chev-stroke" stroke-width="96" stroke-linecap="round"/>

</svg>
